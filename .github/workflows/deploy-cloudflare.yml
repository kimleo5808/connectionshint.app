name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  schedule:
    # Daily at 06:00 UTC, after the puzzle-updater worker (01:00 UTC) refreshes KV
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEXT_PUBLIC_SITE_URL: https://connectionshint.app
      NEXT_PUBLIC_GOOGLE_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ID }}
      NEXT_PUBLIC_GOOGLE_ADSENSE_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADSENSE_ID }}
      NEXT_PUBLIC_BAIDU_TONGJI: ${{ secrets.NEXT_PUBLIC_BAIDU_TONGJI }}
      NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ${{ secrets.NEXT_PUBLIC_PLAUSIBLE_DOMAIN }}
      NEXT_PUBLIC_PLAUSIBLE_SRC: ${{ secrets.NEXT_PUBLIC_PLAUSIBLE_SRC }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Sync puzzle data from KV
        run: node scripts/sync-kv-to-json.mjs

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/connections)" ]; then
            git add data/connections/puzzles.json data/connections/puzzle-index.json
            git commit -m "chore(data): sync puzzles from KV [skip ci]"
            git push || echo "::warning::Could not push synced data; build will still use the fresh local copy."
          else
            echo "Data already up to date."
          fi

      - name: Build site
        run: npx opennextjs-cloudflare build

      - name: Deploy site (retry on transient R2 errors)
        run: |
          n=0
          until [ "$n" -ge 3 ]; do
            npx opennextjs-cloudflare deploy && exit 0
            n=$((n + 1))
            echo "::warning::Deploy attempt $n failed (likely a transient R2 429/500). Retrying in 30s..."
            sleep 30
          done
          echo "::error::Deploy failed after 3 attempts."
          exit 1

      - name: Deploy puzzle updater cron worker
        run: cd workers/puzzle-updater && npx wrangler deploy
