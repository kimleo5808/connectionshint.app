<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-label="A simple visual workflow for solving a Connections puzzle">
  <rect width="960" height="300" rx="18" fill="#eef2ff"/>
  <text x="40" y="56" font-size="28" font-weight="700" fill="#3730a3" font-family="Arial, sans-serif">A Visual Solving Workflow</text>
  <g font-family="Arial, sans-serif">
    <!-- step 1 -->
    <rect x="40"  y="96" width="190" height="150" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <circle cx="70" cy="128" r="18" fill="#6366f1"/>
    <text x="70" y="135" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="60" y="180" font-size="20" font-weight="700" fill="#1e293b">Scan all 16</text>
    <text x="60" y="208" font-size="17" fill="#475569">Read every word</text>
    <text x="60" y="230" font-size="17" fill="#475569">before touching</text>
    <!-- step 2 -->
    <rect x="270" y="96" width="190" height="150" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <circle cx="300" cy="128" r="18" fill="#6366f1"/>
    <text x="300" y="135" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="290" y="180" font-size="20" font-weight="700" fill="#1e293b">Color-tag</text>
    <text x="290" y="208" font-size="17" fill="#475569">Sort words into</text>
    <text x="290" y="230" font-size="17" fill="#475569">visual buckets</text>
    <!-- step 3 -->
    <rect x="500" y="96" width="190" height="150" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <circle cx="530" cy="128" r="18" fill="#6366f1"/>
    <text x="530" y="135" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="520" y="180" font-size="20" font-weight="700" fill="#1e293b">Solve safest</text>
    <text x="520" y="208" font-size="17" fill="#475569">Guess your most</text>
    <text x="520" y="230" font-size="17" fill="#475569">certain group</text>
    <!-- step 4 -->
    <rect x="730" y="96" width="190" height="150" rx="14" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <circle cx="760" cy="128" r="18" fill="#6366f1"/>
    <text x="760" y="135" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="750" y="180" font-size="20" font-weight="700" fill="#1e293b">Reassess</text>
    <text x="750" y="208" font-size="17" fill="#475569">Re-read what's</text>
    <text x="750" y="230" font-size="17" fill="#475569">left, repeat</text>
    <!-- arrows -->
    <g fill="#6366f1">
      <path d="M232 171 l24 -10 v20 z"/>
      <path d="M462 171 l24 -10 v20 z"/>
      <path d="M692 171 l24 -10 v20 z"/>
    </g>
  </g>
</svg>
