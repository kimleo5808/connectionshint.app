<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Using visual aids to master NYT Connections">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <g opacity="0.12" fill="#ffffff">
    <circle cx="120" cy="120" r="80"/>
    <circle cx="1080" cy="520" r="120"/>
    <circle cx="1040" cy="90" r="46"/>
  </g>
  <!-- 4x4 connections grid -->
  <g transform="translate(70,150)">
    <g fill="url(#card)">
      <!-- yellow row -->
      <rect x="0"   y="0"   width="110" height="72" rx="12" fill="#f9df6d"/>
      <rect x="126" y="0"   width="110" height="72" rx="12" fill="#f9df6d"/>
      <rect x="252" y="0"   width="110" height="72" rx="12" fill="#f9df6d"/>
      <rect x="378" y="0"   width="110" height="72" rx="12" fill="#f9df6d"/>
      <!-- green row -->
      <rect x="0"   y="88"  width="110" height="72" rx="12" fill="#a0c35a"/>
      <rect x="126" y="88"  width="110" height="72" rx="12" fill="#a0c35a"/>
      <rect x="252" y="88"  width="110" height="72" rx="12" fill="#a0c35a"/>
      <rect x="378" y="88"  width="110" height="72" rx="12" fill="#a0c35a"/>
      <!-- blue row -->
      <rect x="0"   y="176" width="110" height="72" rx="12" fill="#b0c4ef"/>
      <rect x="126" y="176" width="110" height="72" rx="12" fill="#b0c4ef"/>
      <rect x="252" y="176" width="110" height="72" rx="12" fill="#b0c4ef"/>
      <rect x="378" y="176" width="110" height="72" rx="12" fill="#b0c4ef"/>
      <!-- purple row -->
      <rect x="0"   y="264" width="110" height="72" rx="12" fill="#ba81c5"/>
      <rect x="126" y="264" width="110" height="72" rx="12" fill="#ba81c5"/>
      <rect x="252" y="264" width="110" height="72" rx="12" fill="#ba81c5"/>
      <rect x="378" y="264" width="110" height="72" rx="12" fill="#ba81c5"/>
    </g>
  </g>
  <g fill="#ffffff" font-family="Georgia, 'Times New Roman', serif">
    <text x="620" y="230" font-size="62" font-weight="700">Visual Aids for</text>
    <text x="620" y="300" font-size="62" font-weight="700">NYT Connections</text>
    <text x="620" y="372" font-size="30" fill="#e0e7ff" font-family="Arial, sans-serif">See the groups before you guess them</text>
  </g>
  <g transform="translate(620,430)">
    <rect width="360" height="60" rx="30" fill="#ffffff"/>
    <text x="30" y="39" font-size="26" font-weight="700" fill="#4338ca" font-family="Arial, sans-serif">4 groups &#183; 4 words each</text>
  </g>
</svg>
