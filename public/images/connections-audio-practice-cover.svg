<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Practicing NYT Connections with audio and voice">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e7490"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg3)"/>
  <g opacity="0.12" fill="#ffffff">
    <circle cx="130" cy="130" r="90"/>
    <circle cx="1070" cy="500" r="120"/>
  </g>
  <!-- Sound wave -->
  <g transform="translate(90,300)" fill="#ffffff">
    <rect x="0"   y="-20"  width="16" height="40"  rx="8"/>
    <rect x="28"  y="-55"  width="16" height="110" rx="8"/>
    <rect x="56"  y="-90"  width="16" height="180" rx="8"/>
    <rect x="84"  y="-45"  width="16" height="90"  rx="8"/>
    <rect x="112" y="-110" width="16" height="220" rx="8"/>
    <rect x="140" y="-70"  width="16" height="140" rx="8"/>
    <rect x="168" y="-30"  width="16" height="60"  rx="8"/>
    <rect x="196" y="-85"  width="16" height="170" rx="8"/>
    <rect x="224" y="-50"  width="16" height="100" rx="8"/>
    <rect x="252" y="-18"  width="16" height="36"  rx="8"/>
  </g>
  <!-- Speaker icon -->
  <g transform="translate(90,150)" fill="#ffffff">
    <path d="M0 20 h22 l30 -26 v78 l-30 -26 h-22 z"/>
    <path d="M66 8 a34 34 0 0 1 0 60" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M80 -6 a54 54 0 0 1 0 88" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>
  <g fill="#ffffff" font-family="Georgia, 'Times New Roman', serif">
