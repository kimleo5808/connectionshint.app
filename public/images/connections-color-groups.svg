<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-label="The four difficulty colors in NYT Connections">
  <rect width="960" height="420" rx="18" fill="#f8fafc"/>
  <text x="40" y="60" font-size="30" font-weight="700" fill="#1e293b" font-family="Arial, sans-serif">The Four Difficulty Colors</text>
  <g font-family="Arial, sans-serif">
    <!-- Yellow -->
    <rect x="40"  y="96" width="880" height="64" rx="12" fill="#f9df6d"/>
    <text x="64"  y="136" font-size="24" font-weight="700" fill="#7a5c00">YELLOW</text>
    <text x="260" y="136" font-size="22" fill="#5b4600">Easiest &#8212; the most obvious, straightforward group</text>
    <!-- Green -->
    <rect x="40"  y="172" width="880" height="64" rx="12" fill="#a0c35a"/>
    <text x="64"  y="212" font-size="24" font-weight="700" fill="#31491a">GREEN</text>
    <text x="260" y="212" font-size="22" fill="#31491a">Fairly easy &#8212; a clear but less obvious theme</text>
    <!-- Blue -->
    <rect x="40"  y="248" width="880" height="64" rx="12" fill="#b0c4ef"/>
    <text x="64"  y="288" font-size="24" font-weight="700" fill="#20335e">BLUE</text>
    <text x="260" y="288" font-size="22" fill="#20335e">Tricky &#8212; often relies on wordplay or niche knowledge</text>
    <!-- Purple -->
    <rect x="40"  y="324" width="880" height="64" rx="12" fill="#ba81c5"/>
    <text x="64"  y="364" font-size="24" font-weight="700" fill="#4a2153">PURPLE</text>
    <text x="260" y="364" font-size="22" fill="#4a2153">Hardest &#8212; hidden words, puns, and clever patterns</text>
  </g>
</svg>
