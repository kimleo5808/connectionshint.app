<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Creating printable NYT Connections puzzle packs">
  <defs>
    <linearGradient id="bg5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg5)"/>
  <g opacity="0.12" fill="#ffffff">
    <circle cx="140" cy="150" r="90"/>
    <circle cx="1060" cy="500" r="120"/>
  </g>
  <!-- stacked paper sheets -->
  <g transform="translate(110,180)">
    <rect x="40" y="30" width="230" height="290" rx="14" fill="#ffffff" opacity="0.35"/>
    <rect x="20" y="15" width="230" height="290" rx="14" fill="#ffffff" opacity="0.6"/>
    <rect x="0"  y="0"  width="230" height="290" rx="14" fill="#ffffff"/>
    <!-- mini grid on top sheet -->
    <g transform="translate(26,34)">
      <rect x="0"   y="0"   width="40" height="34" rx="6" fill="#f9df6d"/>
      <rect x="46"  y="0"   width="40" height="34" rx="6" fill="#f9df6d"/>
      <rect x="92"  y="0"   width="40" height="34" rx="6" fill="#f9df6d"/>
      <rect x="138" y="0"   width="40" height="34" rx="6" fill="#f9df6d"/>
      <rect x="0"   y="40"  width="40" height="34" rx="6" fill="#a0c35a"/>
      <rect x="46"  y="40"  width="40" height="34" rx="6" fill="#a0c35a"/>
      <rect x="92"  y="40"  width="40" height="34" rx="6" fill="#a0c35a"/>
      <rect x="138" y="40"  width="40" height="34" rx="6" fill="#a0c35a"/>
      <rect x="0"   y="80"  width="40" height="34" rx="6" fill="#b0c4ef"/>
      <rect x="46"  y="80"  width="40" height="34" rx="6" fill="#b0c4ef"/>
      <rect x="92"  y="80"  width="40" height="34" rx="6" fill="#b0c4ef"/>
      <rect x="138" y="80"  width="40" height="34" rx="6" fill="#b0c4ef"/>
      <rect x="0"   y="120" width="40" height="34" rx="6" fill="#ba81c5"/>
      <rect x="46"  y="120" width="40" height="34" rx="6" fill="#ba81c5"/>
      <rect x="92"  y="120" width="40" height="34" rx="6" fill="#ba81c5"/>
      <rect x="138" y="120" width="40" height="34" rx="6" fill="#ba81c5"/>
    </g>
    <rect x="26" y="212" width="178" height="14" rx="7" fill="#e2e8f0"/>
    <rect x="26" y="238" width="140" height="14" rx="7" fill="#e2e8f0"/>
  </g>
  <g fill="#ffffff" font-family="Georgia, 'Times New Roman', serif">
    <text x="470" y="250" font-size="58" font-weight="700">Printable Connections</text>
    <text x="470" y="320" font-size="58" font-weight="700">Puzzle Packs</text>
    <text x="470" y="390" font-size="30" fill="#cffafe" font-family="Arial, sans-serif">Print, convert, and share puzzles offline</text>
  </g>
</svg>
