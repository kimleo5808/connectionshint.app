<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Playing NYT Connections and Wordle together">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg2)"/>
  <g opacity="0.12" fill="#ffffff">
    <circle cx="140" cy="500" r="90"/>
    <circle cx="1060" cy="120" r="120"/>
  </g>
  <!-- Wordle row of tiles -->
  <g transform="translate(70,150)" font-family="Arial, sans-serif" font-weight="700" text-anchor="middle">
    <g>
      <rect x="0"   y="0" width="86" height="86" rx="8" fill="#6aaa64"/>
      <text x="43"  y="58" font-size="44" fill="#ffffff">W</text>
      <rect x="98"  y="0" width="86" height="86" rx="8" fill="#c9b458"/>
      <text x="141" y="58" font-size="44" fill="#ffffff">O</text>
      <rect x="196" y="0" width="86" height="86" rx="8" fill="#787c7e"/>
      <text x="239" y="58" font-size="44" fill="#ffffff">R</text>
      <rect x="294" y="0" width="86" height="86" rx="8" fill="#6aaa64"/>
      <text x="337" y="58" font-size="44" fill="#ffffff">D</text>
      <rect x="392" y="0" width="86" height="86" rx="8" fill="#c9b458"/>
      <text x="435" y="58" font-size="44" fill="#ffffff">S</text>
    </g>
  </g>
  <!-- Connections mini grid -->
  <g transform="translate(70,270)">
    <rect x="0"   y="0"  width="86" height="60" rx="10" fill="#f9df6d"/>
    <rect x="98"  y="0"  width="86" height="60" rx="10" fill="#a0c35a"/>
    <rect x="196" y="0"  width="86" height="60" rx="10" fill="#b0c4ef"/>
    <rect x="294" y="0"  width="86" height="60" rx="10" fill="#ba81c5"/>
    <rect x="392" y="0"  width="86" height="60" rx="10" fill="#f9df6d"/>
  </g>
  <g fill="#ffffff" font-family="Georgia, 'Times New Roman', serif">
    <text x="620" y="250" font-size="60" font-weight="700">Connections</text>
    <text x="620" y="322" font-size="60" font-weight="700">meets Wordle</text>
    <text x="620" y="392" font-size="30" fill="#c7d2fe" font-family="Arial, sans-serif">Two daily habits, one sharper mind</text>
  </g>
  <g transform="translate(70,380)">
    <rect width="470" height="60" rx="30" fill="#ffffff" opacity="0.95"/>
    <text x="30" y="39" font-size="24" font-weight="700" fill="#0f766e" font-family="Arial, sans-serif">Warm up daily &#183; solve smarter</text>
  </g>
</svg>
